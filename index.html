<!-- SPA ( Single Page Application )         [ Pesquisar ] -->
<!-- É uma aplicação/estrutura onde o conteúdo mostrado na página, é inserido por meio do javascript(React) e não pelo html, como padrão. -->
<!-- Exemplo: se você for em inspecionar e remover todo o conteúdo de javascript do site. Simplesmente não aparecerá mais nada... Já que o conteúdo ao todo é inserido através do Javascript -->

<!-- VANTAGENS DE SPAs -->
<!--   - Velocidade: Navegacação entre páginas é muito mais rápido, pois não exige chamadas para um servidor -->
<!--   - Experiência do usuário: SPAs são altamente interativas e performáticas. -->
